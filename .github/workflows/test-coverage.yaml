# Reports test coverage. Coverage is measured without ASReml-R, so the
# model-fitting code is necessarily under-represented; the figure describes
# the part of the package that a contributor without a commercial licence can
# actually exercise.
on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

name: test-coverage

permissions: read-all

jobs:
  test-coverage:
    runs-on: ubuntu-latest
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      # `asreml` is commercial and is in no repository, so pak cannot resolve
      # it and `dependencies: all` fails outright. Suggests are skipped
      # wholesale and every one that checking actually needs is named here.
      # The ASReml-gated tests and vignette chunks skip themselves.
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          dependencies: '"hard"'
          extra-packages: |
            any::covr
            any::xml2
            any::bsicons
            any::covr
            any::ggrepel
            any::knitr
            any::patchwork
            any::plotly
            any::ragg
            any::rmarkdown
            any::shinycssloaders
            any::shinyWidgets
            any::svglite
            any::testthat
            any::thematic
            any::withr
            any::writexl
          needs: coverage

      - name: Test coverage
        run: |
          cov <- covr::package_coverage(quiet = FALSE, clean = FALSE)
          print(cov)
          covr::to_cobertura(cov)
        shell: Rscript {0}

      - uses: codecov/codecov-action@v4
        with:
          fail_ci_if_error: false
          file: ./cobertura.xml
          plugins: noop
          token: ${{ secrets.CODECOV_TOKEN }}
