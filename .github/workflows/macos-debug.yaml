# TEMPORARY diagnostic workflow.
#
# macOS fails `R CMD check --as-cran` with
#   Failure (test-app.R:114:5): save_figure writes each supported raster format
#   Expected file.exists(f) to be TRUE
# so save_figure() returns without error yet leaves no file. Every other
# platform passes, and a plain (non-as-cran) check on macOS passes too.
#
# Reading the job log needs a token this environment does not have, but
# ::error:: annotations are public. Earlier rounds emitted so many annotations
# that the interesting lines were crowded out, so this run does nothing except
# the probe, and reports one line per format.
#
# Delete this file once the macOS failure is fixed.
on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths:
      - '.github/workflows/macos-debug.yaml'

name: macos-debug

permissions: read-all

jobs:
  macos-debug:
    runs-on: macos-latest
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      _R_CHECK_FORCE_SUGGESTS_: false

    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: 'release'
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          dependencies: '"hard"'
          extra-packages: |
            any::ragg
            any::svglite
            any::testthat
            any::withr
            local::.

      - name: Probe save_figure
        shell: bash
        run: |
          cat > probe.R <<'PROBE'
          report <- function(...) cat("::error::PROBE ", paste0(...), "\n", sep = "")
          library(InterPlotComp)
          report("ggplot2=", as.character(packageVersion("ggplot2")),
                 " ragg=", as.character(packageVersion("ragg")),
                 " cairo=", capabilities("cairo"))
          pfun <- function(bs) ggplot2::ggplot(data.frame(x = 1:5, y = 1:5), ggplot2::aes(x, y)) + ggplot2::geom_point()
          for (fmt in c("png", "pdf")) {
            f <- file.path(tempdir(), paste0("probe.", fmt))
            cond <- "none"
            val <- withCallingHandlers(
              tryCatch(InterPlotComp::save_figure(pfun, f, format = fmt, width = 12, height = 8, dpi = 100),
                       error = function(e) { cond <<- paste("ERROR:", conditionMessage(e)); NA }),
              warning = function(w) { cond <<- paste("WARNING:", conditionMessage(w)); invokeRestart("muffleWarning") })
            report(fmt, " returned=", paste(as.character(val), collapse = ","),
                   " cond=", cond, " exists=", file.exists(f),
                   " size=", if (file.exists(f)) file.size(f) else -1)
          }
          # What did ggsave actually put on disk, under any name?
          report("tempdir files: ", paste(list.files(tempdir(), recursive = TRUE), collapse = " | "))
          report("cwd files: ", paste(list.files(".", pattern = "[.](png|pdf)$"), collapse = " | "))
          PROBE
          Rscript probe.R
