# TEMPORARY diagnostic workflow.
#
# The macOS release job failed with "R CMD check found ERRORs" while Ubuntu
# (devel/release/oldrel-1) and Windows all passed. Reading the job log needs an
# authenticated token, which is not available here, but each *step's* pass/fail
# is public. So the check is split into its three independent phases, each
# allowed to fail, and which step goes red identifies the phase at fault.
#
# Delete this file once the macOS failure is understood and fixed.
on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths:
      - '.github/workflows/macos-debug.yaml'

name: macos-debug

permissions: read-all

jobs:
  macos-debug:
    runs-on: macos-latest
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      _R_CHECK_FORCE_SUGGESTS_: false
      NOT_CRAN: true

    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: 'release'
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          dependencies: '"hard"'
          extra-packages: |
            any::rcmdcheck
            any::bsicons
            any::covr
            any::ggrepel
            any::knitr
            any::patchwork
            any::plotly
            any::ragg
            any::rmarkdown
            any::shinycssloaders
            any::shinyWidgets
            any::svglite
            any::testthat
            any::thematic
            any::withr
            any::writexl
          needs: check

      - name: Report the environment
        run: |
          cat(R.version.string, "\n")
          cat("cairo:", capabilities("cairo"), " X11:", capabilities("X11"), "\n")
          cat("ragg:", requireNamespace("ragg", quietly = TRUE),
              " svglite:", requireNamespace("svglite", quietly = TRUE),
              " patchwork:", requireNamespace("patchwork", quietly = TRUE),
              " ggrepel:", requireNamespace("ggrepel", quietly = TRUE), "\n")
          cat("asreml:", nzchar(system.file(package = "asreml")), "\n")
          cat("locale:", Sys.getlocale("LC_CTYPE"), "\n")
        shell: Rscript {0}

      - name: PHASE build
        id: build
        continue-on-error: true
        run: R CMD build --no-build-vignettes .

      - name: PHASE examples only
        id: examples
        continue-on-error: true
        run: R CMD check --no-tests --no-vignettes --no-manual InterPlotComp_*.tar.gz

      - name: PHASE tests only
        id: tests
        continue-on-error: true
        run: |
          rm -rf InterPlotComp.Rcheck
          R CMD check --no-examples --no-vignettes --no-manual InterPlotComp_*.tar.gz

      - name: PHASE vignettes only
        id: vignettes
        continue-on-error: true
        run: |
          rm -rf InterPlotComp.Rcheck InterPlotComp_*.tar.gz
          R CMD build .
          R CMD check --no-examples --no-tests --no-manual InterPlotComp_*.tar.gz

      # The log is unreadable without a token, but a failing step's own stdout
      # becomes an annotation, which is public. Re-emit whatever the check
      # recorded so the cause reaches somewhere readable.
      - name: Surface the check log as annotations
        if: always()
        run: |
          for f in InterPlotComp.Rcheck/00check.log InterPlotComp.Rcheck/00install.out; do
            [ -f "$f" ] || continue
            echo "::group::$f"
            sed -n '1,400p' "$f"
            echo "::endgroup::"
            grep -nE "ERROR|WARNING" -A 12 "$f" | head -80 | while IFS= read -r line; do
              echo "::error::$line"
            done
          done
