# Builds the package website and publishes it to GitHub Pages.
#
# Deployment is by pushing the built site to the gh-pages branch, with Pages
# configured as Source = "Deploy from a branch", branch gh-pages, folder /.
#
# This was briefly changed to the official Pages actions on the belief that a
# push made with GITHUB_TOKEN would not trigger a Pages build. That was wrong:
# the run history shows a "pages build and deployment" triggered by this
# workflow's own push, and it succeeded. The site outage that prompted the
# change was the repository being switched to private, which disables Pages on
# a free account. The branch approach also needs no deployment-branch rule on
# the github-pages environment, which the Actions approach did.
on:
  push:
    branches: [main, master]
  release:
    types: [published]
  workflow_dispatch:

name: pkgdown

permissions: read-all

jobs:
  pkgdown:
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request'
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      # `asreml` is commercial and is in no repository, so pak cannot resolve
      # it and `dependencies: all` fails outright. Suggests are skipped
      # wholesale and every one the site actually needs is named here.
      # The ASReml-gated vignette chunks skip themselves.
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          dependencies: '"hard"'
          extra-packages: |
            any::pkgdown
            local::.
            any::bsicons
            any::covr
            any::ggrepel
            any::knitr
            any::patchwork
            any::plotly
            any::ragg
            any::rmarkdown
            any::shinycssloaders
            any::shinyWidgets
            any::svglite
            any::testthat
            any::thematic
            any::withr
            any::writexl
          needs: website

      # ASReml-R is unavailable here, so every fitting chunk in the vignettes
      # is skipped by its own `eval = has_asreml` guard and the articles build
      # showing the code without its output.
      - name: Build site
        run: pkgdown::build_site_github_pages(new_process = FALSE, install = FALSE)
        shell: Rscript {0}

      # Deploying an empty or half-built directory would silently replace a
      # working site, so fail here instead.
      - name: Fail if the site did not build
        run: |
          test -f docs/index.html || { echo "docs/index.html missing"; exit 1; }
          echo "pages built: $(find docs -name '*.html' | wc -l) html files"

      - name: Deploy to GitHub Pages
        uses: JamesIves/github-pages-deploy-action@v4.5.0
        with:
          clean: false
          branch: gh-pages
          folder: docs
