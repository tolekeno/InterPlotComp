# Builds the package website and deploys it straight to GitHub Pages.
#
# This deploys through the official Pages actions rather than by pushing a
# gh-pages branch. The branch approach failed in practice: GitHub does not
# trigger downstream builds for pushes made with GITHUB_TOKEN, which is what a
# deploy action uses, so the site only ever published when someone pushed that
# branch by hand. deploy-pages publishes the artifact directly and does not
# depend on a push event at all.
#
# Requires Settings -> Pages -> Source = "GitHub Actions".
on:
  push:
    branches: [main, master]
  release:
    types: [published]
  workflow_dispatch:

name: pkgdown

permissions:
  contents: read
  pages: write
  id-token: write

# Never let two deployments race; queue instead of cancelling, so a finished
# build is not discarded half-published.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  pkgdown:
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      # `asreml` is commercial and is in no repository, so pak cannot resolve
      # it and `dependencies: all` fails outright. Suggests are skipped
      # wholesale and every one the site actually needs is named here.
      # The ASReml-gated vignette chunks skip themselves.
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          dependencies: '"hard"'
          extra-packages: |
            any::pkgdown
            local::.
            any::bsicons
            any::covr
            any::ggrepel
            any::knitr
            any::patchwork
            any::plotly
            any::ragg
            any::rmarkdown
            any::shinycssloaders
            any::shinyWidgets
            any::svglite
            any::testthat
            any::thematic
            any::withr
            any::writexl
          needs: website

      # ASReml-R is unavailable here, so every fitting chunk in the vignettes
      # is skipped by its own `eval = has_asreml` guard and the articles build
      # showing the code without its output.
      - name: Build site
        run: pkgdown::build_site_github_pages(new_process = FALSE, install = FALSE)
        shell: Rscript {0}

      - name: Fail if the site did not build
        run: |
          test -f docs/index.html || { echo "docs/index.html missing"; exit 1; }
          echo "pages built: $(find docs -name '*.html' | wc -l) html files"

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
